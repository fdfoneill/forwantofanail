services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: forwantofanail
      POSTGRES_USER: forwantofanail
      POSTGRES_PASSWORD: development-only
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forwantofanail"]
      interval: 2s
      timeout: 2s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
