    function renderSupplyStatusSection(view) {
      const supply = view?.army?.supply || null;
      const daysText = supply?.days_estimate == null
        ? "-"
        : String(Math.floor(Number(supply.days_estimate)));
      els.supplyStatusText.textContent = `Supply: ${daysText} days remaining`;
      els.supplyCurrentText.textContent = String(supply?.current ?? "-");
      els.supplyCapacityText.textContent = String(supply?.capacity ?? "-");
      els.supplyDailyText.textContent = String(supply?.daily_consumption ?? "-");
      if (state.supplyPanelExpanded) {
        els.supplyStatusPanel.removeAttribute("hidden");
        els.supplyStatusChevron.textContent = "▾";
      } else {
        els.supplyStatusPanel.setAttribute("hidden", "");
        els.supplyStatusChevron.textContent = "▸";
      }
    }

    function ordersStatusText(view) {
      const kind = String(view?.current_action?.kind || "").trim().toLowerCase();
      if (kind === "move" || kind === "march") {
        return "Orders: March";
      }
      if (kind === "forage") {
        return "Orders: Forage";
      }
      if (kind === "attack") {
        return "Orders: Attack";
      }
      if (kind === "besiege") {
        return "Orders: Besiege";
      }
      if (kind === "rout") {
        return "Orders: Routed";
      }
      return "Orders: Hold";
    }

    function renderOrdersStatusSection(view) {
      els.ordersStatusText.textContent = ordersStatusText(view);
      if (state.ordersPanelExpanded) {
        els.ordersPanel.removeAttribute("hidden");
        els.ordersStatusChevron.textContent = "▾";
      } else {
        els.ordersPanel.setAttribute("hidden", "");
        els.ordersStatusChevron.textContent = "▸";
      }
    }

    function currentWatchIndex() {
      return Number(state.view?.time?.watch);
    }

    function maxMarchSteps() {
      const watch = currentWatchIndex();
      if (!Number.isFinite(watch)) {
        return 0;
      }
      if (watch <= 1) {
        return 4;
      }
      return Math.max(0, 5 - watch);
    }

    function isNightWatch() {
      return currentWatchIndex() === 0;
    }

    function isNightOrMatinWatch() {
      const watch = currentWatchIndex();
      return watch === 0 || watch === 1;
    }

    function renderStagedPathList() {
      if (state.orderMode === "attack") {
        if (!state.stagedAttack) {
          const targets = Array.from(state.validAttackTargets.values());
          if (!targets.length) {
            els.stagedPathList.innerHTML = "<li class=\"staged-empty\">No adjacent enemy armies available to attack.</li>";
            return;
          }
          const rows = targets.map((target) => {
            const h3Label = String(target.target_h3 || "").trim();
            const label = String(target.label || target.faction || "Enemy army").trim();
            return (
              `<li class="staged-item">` +
              `<span>${label}</span>` +
              `<button class="staged-remove" data-attack-target="${h3Label}" type="button">Stage</button>` +
              `</li>`
            );
          });
          els.stagedPathList.innerHTML = rows.join("");
          els.stagedPathList.querySelectorAll("button[data-attack-target]").forEach((btn) => {
            btn.addEventListener("click", async () => {
              const h3Index = String(btn.dataset.attackTarget || "").trim();
              if (!h3Index) return;
              await stageMoveToCell(h3Index);
            });
          });
          return;
        }
        const label = String(state.stagedAttack.label || state.stagedAttack.target_h3 || "Target");
        els.stagedPathList.innerHTML =
          `<li class="staged-item"><span>Target: ${label}</span>` +
          `<button class="staged-remove" data-clear-attack=\"1\" type="button">Clear</button></li>`;
        const clearBtn = els.stagedPathList.querySelector("button[data-clear-attack]");
        if (clearBtn) {
          clearBtn.addEventListener("click", async () => {
            state.stagedAttack = null;
            renderStagedPathList();
            await refreshValidAttackTargets().catch(() => {});
            renderMap();
          });
        }
        return;
      }
      if (state.orderMode === "besiege") {
        if (!state.stagedSiege) {
          const targets = Array.from(state.validBesiegeTargets.values());
          if (!targets.length) {
            els.stagedPathList.innerHTML = "<li class=\"staged-empty\">No adjacent enemy strongholds available to besiege.</li>";
            return;
          }
          const rows = targets.map((target) => (
            `<li class="staged-item">` +
            `<span>${String(target.stronghold_name || "Stronghold")}</span>` +
            `<button class="staged-remove" data-besiege-target="${String(target.target_h3 || "").trim()}" type="button">Stage</button>` +
            `</li>`
          ));
          els.stagedPathList.innerHTML = rows.join("");
          els.stagedPathList.querySelectorAll("button[data-besiege-target]").forEach((btn) => {
            btn.addEventListener("click", async () => {
              const h3Index = String(btn.dataset.besiegeTarget || "").trim();
              if (!h3Index) return;
              await stageMoveToCell(h3Index);
            });
          });
          return;
        }
        const label = String(state.stagedSiege.stronghold_name || state.stagedSiege.target_h3 || "Stronghold");
        els.stagedPathList.innerHTML =
          `<li class="staged-item"><span>Target: ${label}</span>` +
          `<button class="staged-remove" data-clear-besiege="1" type="button">Clear</button></li>`;
        const clearBtn = els.stagedPathList.querySelector("button[data-clear-besiege]");
        if (clearBtn) {
          clearBtn.addEventListener("click", async () => {
            state.stagedSiege = null;
            renderStagedPathList();
            await refreshValidBesiegeTargets().catch(() => {});
            renderMap();
          });
        }
        return;
      }
      if (!state.stagedPath.length) {
        els.stagedPathList.innerHTML = "<li class=\"staged-empty\">No staged march cells.</li>";
        return;
      }
      const currentWatch = Number(state.view?.time?.watch);
      const startWatch = currentWatch === 0 ? 1 : currentWatch;
      const watchLabelForStage = (idx) => {
        const watchIndex = startWatch + idx;
        if (!Number.isFinite(watchIndex) || watchIndex < 0 || watchIndex > 4) {
          return `Step ${idx + 1}`;
        }
        return WATCH_NAME_BY_INDEX[watchIndex] || `Step ${idx + 1}`;
      };
      const cellByH3 = new Map((state.view?.environs?.cells || []).map((cell) => [cell.h3, cell]));
      const rows = state.stagedPath.map((h3Index, idx) => (
        (() => {
          const isLast = idx === state.stagedPath.length - 1;
          const cell = cellByH3.get(h3Index);
          const title = String(cell?.cell_title || h3Index);
          const watchLabel = watchLabelForStage(idx);
          const removeControl = isLast
            ? `<button class="staged-remove" data-stage-idx="${idx}" type="button">Remove</button>`
            : `<span></span>`;
          return (
        `<li class="staged-item">` +
        `<span>${watchLabel}: ${title}</span>` +
        `${removeControl}` +
        `</li>`
          );
        })()
      ));
      els.stagedPathList.innerHTML = rows.join("");
      els.stagedPathList.querySelectorAll("button[data-stage-idx]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.dataset.stageIdx);
          if (!Number.isFinite(idx) || idx < 0 || idx >= state.stagedPath.length) {
            return;
          }
          state.stagedPath.splice(idx, 1);
          renderStagedPathList();
          refreshOrderTargets()
            .catch(() => {})
            .finally(() => {
              renderMap();
            });
        });
      });
    }

    function renderOrdersPanel() {
      const maxSteps = maxMarchSteps();
      const isMarch = state.orderMode === "march";
      const isForage = state.orderMode === "forage";
      const isAttack = state.orderMode === "attack";
      const isBesiege = state.orderMode === "besiege";
      const isRouting = String(state.view?.current_action?.kind || "").trim().toLowerCase() === "rout";
      const centerCell = (state.view?.environs?.cells || []).find((cell) => cell.h3 === state.view?.environs?.center_h3);
      const attackBlockedByStronghold = !!centerCell?.stronghold;
      const besiegeBlockedByStronghold = !!centerCell?.stronghold;
      els.orderModeSelect.value = state.orderMode;
      els.queueMoveBtn.disabled = !(isMarch || isAttack || isBesiege) || isRouting;
      els.stagedPathList.style.display = (isMarch || isAttack || isBesiege) ? "" : "none";
      els.queueMoveBtn.textContent = isAttack ? "Stage Attack" : (isBesiege ? "Stage Siege" : "Stage Move");
      els.submitOrdersBtn.disabled = isRouting || (isForage && !isNightOrMatinWatch()) || (isAttack && (attackBlockedByStronghold || !state.stagedAttack)) || (isBesiege && (besiegeBlockedByStronghold || !state.stagedSiege));
      const forageOption = els.orderModeSelect.querySelector("option[value=\"forage\"]");
      if (forageOption) {
        forageOption.disabled = !isNightOrMatinWatch();
      }
      const attackOption = els.orderModeSelect.querySelector("option[value=\"attack\"]");
      if (attackOption) {
        attackOption.disabled = isRouting || attackBlockedByStronghold;
      }
      const marchOption = els.orderModeSelect.querySelector("option[value=\"march\"]");
      if (marchOption) {
        marchOption.disabled = isRouting;
      }
      const besiegeOption = els.orderModeSelect.querySelector("option[value=\"besiege\"]");
      if (besiegeOption) {
        besiegeOption.disabled = isRouting || besiegeBlockedByStronghold;
      }
      if (state.stagedPath.length > maxSteps) {
        state.stagedPath = state.stagedPath.slice(0, maxSteps);
      }
      if (attackBlockedByStronghold && state.orderMode === "attack") {
        state.stagedAttack = null;
      }
      if (besiegeBlockedByStronghold && state.orderMode === "besiege") {
        state.stagedSiege = null;
      }
      if (isAttack && state.stagedPath.length) {
        state.stagedPath = [];
      }
      renderStagedPathList();
      updateStageMoveButtonVisibility(state.hoverH3);
      updateHoveredMoveOutline(state.hoverH3);
    }

    async function refreshValidNextMoves() {
      state.validNextMoves = new Set();
      if (!state.token || !state.view || state.orderMode !== "march") {
        updateStageMoveButtonVisibility(state.hoverH3);
        updateHoveredMoveOutline(state.hoverH3);
        return;
      }
      const origin = state.stagedPath.length
        ? state.stagedPath[state.stagedPath.length - 1]
        : state.view.environs.center_h3;
      if (!origin) {
        updateStageMoveButtonVisibility(state.hoverH3);
        updateHoveredMoveOutline(state.hoverH3);
        return;
      }
      const payload = await api(`/v1/me/actions/valid-next?origin_h3=${encodeURIComponent(origin)}`, {}, true);
      const valid = Array.isArray(payload.valid_destinations) ? payload.valid_destinations : [];
      state.validNextMoves = new Set(valid.map((value) => String(value)));
      updateStageMoveButtonVisibility(state.hoverH3);
      updateHoveredMoveOutline(state.hoverH3);
    }

    async function refreshValidAttackTargets() {
      state.validAttackTargets = new Map();
      if (!state.token || !state.view || state.orderMode !== "attack") {
        renderStagedPathList();
        updateStageMoveButtonVisibility(state.hoverH3);
        updateHoveredMoveOutline(state.hoverH3);
        return;
      }
      const origin = state.view.environs.center_h3;
      if (!origin) {
        renderStagedPathList();
        updateStageMoveButtonVisibility(state.hoverH3);
        updateHoveredMoveOutline(state.hoverH3);
        return;
      }
      const payload = await api(`/v1/me/actions/valid-attack?origin_h3=${encodeURIComponent(origin)}`, {}, true);
      const targets = Array.isArray(payload.targets) ? payload.targets : [];
      for (const row of targets) {
        const key = String(row?.target_h3 || "").trim();
        if (!key) continue;
        state.validAttackTargets.set(key, {
          target_h3: key,
          target_army_id: String(row?.target_army_id || "").trim(),
          faction: String(row?.faction || "").trim(),
          label: String(row?.label || "").trim(),
        });
      }
      if (state.stagedAttack && !state.validAttackTargets.has(String(state.stagedAttack.target_h3 || ""))) {
        state.stagedAttack = null;
      }
      renderStagedPathList();
      els.submitOrdersBtn.disabled = String(state.view?.current_action?.kind || "").trim().toLowerCase() === "rout" || !state.stagedAttack;
      updateStageMoveButtonVisibility(state.hoverH3);
      updateHoveredMoveOutline(state.hoverH3);
    }

    async function refreshValidBesiegeTargets() {
      state.validBesiegeTargets = new Map();
      if (!state.token || !state.view || state.orderMode !== "besiege") {
        renderStagedPathList();
        updateStageMoveButtonVisibility(state.hoverH3);
        updateHoveredMoveOutline(state.hoverH3);
        return;
      }
      const origin = state.view.environs.center_h3;
      if (!origin) {
        renderStagedPathList();
        updateStageMoveButtonVisibility(state.hoverH3);
        updateHoveredMoveOutline(state.hoverH3);
        return;
      }
      const payload = await api(`/v1/me/actions/valid-besiege?origin_h3=${encodeURIComponent(origin)}`, {}, true);
      const targets = Array.isArray(payload.targets) ? payload.targets : [];
      for (const row of targets) {
        const key = String(row?.target_h3 || "").trim();
        if (!key) continue;
        state.validBesiegeTargets.set(key, {
          target_h3: key,
          stronghold_id: String(row?.stronghold_id || "").trim(),
          stronghold_name: String(row?.stronghold_name || "").trim(),
          faction: String(row?.faction || "").trim(),
          defender_labels: Array.isArray(row?.defender_labels) ? row.defender_labels.map(String) : [],
        });
      }
      if (state.stagedSiege && !state.validBesiegeTargets.has(String(state.stagedSiege.target_h3 || ""))) {
        state.stagedSiege = null;
      }
      renderStagedPathList();
      els.submitOrdersBtn.disabled = String(state.view?.current_action?.kind || "").trim().toLowerCase() === "rout" || !state.stagedSiege;
      updateStageMoveButtonVisibility(state.hoverH3);
      updateHoveredMoveOutline(state.hoverH3);
    }

    async function refreshOrderTargets() {
      if (state.orderMode === "attack") {
        await refreshValidAttackTargets();
      } else if (state.orderMode === "besiege") {
        await refreshValidBesiegeTargets();
      } else {
        await refreshValidNextMoves();
      }
    }

    function canStageMove(targetH3) {
      if (!state.view || !targetH3) {
        return { ok: false, reason: "No active view loaded." };
      }
      const isRouting = String(state.view?.current_action?.kind || "").trim().toLowerCase() === "rout";
      if (isRouting) {
        return { ok: false, reason: "Army is routing; new orders unavailable until regroup." };
      }
      if (state.orderMode !== "march") {
        return { ok: false, reason: "Set orders to March to stage movement." };
      }
      const maxSteps = maxMarchSteps();
      if (maxSteps < 1) {
        return { ok: false, reason: "No march watches remain this day." };
      }
      if (state.stagedPath.length >= maxSteps) {
        return { ok: false, reason: `You can stage at most ${maxSteps} cells right now.` };
      }
      const visible = new Set((state.view?.environs?.cells || []).map((c) => c.h3));
      if (!visible.has(targetH3)) {
        return { ok: false, reason: "Cell is outside your current view." };
      }
      if (!state.validNextMoves.has(targetH3)) {
        return { ok: false, reason: "Cell is not a valid move destination for this army." };
      }
      if (state.stagedPath.includes(targetH3)) {
        return { ok: false, reason: "Cell is already staged." };
      }
      const last = state.stagedPath.length ? state.stagedPath[state.stagedPath.length - 1] : state.view.environs.center_h3;
      if (!areNeighborCells(last, targetH3)) {
        return { ok: false, reason: "Each staged cell must be adjacent to the previous step." };
      }
      return { ok: true, reason: "" };
    }

    function canStageAttack(targetH3) {
      if (!state.view || !targetH3) {
        return { ok: false, reason: "No active view loaded." };
      }
      if (state.orderMode !== "attack") {
        return { ok: false, reason: "Set orders to Attack to stage an attack target." };
      }
      const isRouting = String(state.view?.current_action?.kind || "").trim().toLowerCase() === "rout";
      if (isRouting) {
        return { ok: false, reason: "Army is routing; new orders unavailable until regroup." };
      }
      const visible = new Set((state.view?.environs?.cells || []).map((c) => c.h3));
      if (!visible.has(targetH3)) {
        return { ok: false, reason: "Cell is outside your current view." };
      }
      const target = state.validAttackTargets.get(String(targetH3));
      if (!target) {
        return { ok: false, reason: "Cell is not a valid adjacent enemy target." };
      }
      return { ok: true, reason: "" };
    }

    function canStageBesiege(targetH3) {
      if (!state.view || !targetH3) {
        return { ok: false, reason: "No active view loaded." };
      }
      if (state.orderMode !== "besiege") {
        return { ok: false, reason: "Set orders to Besiege to stage a siege target." };
      }
      const isRouting = String(state.view?.current_action?.kind || "").trim().toLowerCase() === "rout";
      if (isRouting) {
        return { ok: false, reason: "Army is routing; new orders unavailable until regroup." };
      }
      const visible = new Set((state.view?.environs?.cells || []).map((c) => c.h3));
      if (!visible.has(targetH3)) {
        return { ok: false, reason: "Cell is outside your current view." };
      }
      const target = state.validBesiegeTargets.get(String(targetH3));
      if (!target) {
        return { ok: false, reason: "Cell is not a valid adjacent enemy stronghold." };
      }
      return { ok: true, reason: "" };
    }

    function updateStageMoveButtonVisibility(h3Index) {
      const check = state.orderMode === "attack"
        ? canStageAttack(h3Index)
        : (state.orderMode === "besiege" ? canStageBesiege(h3Index) : canStageMove(h3Index));
      const shouldShow = !!h3Index && check.ok;
      els.queueMoveBtn.style.display = shouldShow ? "" : "none";
    }

    function clearHoveredMoveOutline() {
      els.mapCanvas.querySelectorAll(".cell-poly.valid-move-hover").forEach((poly) => {
        poly.classList.remove("valid-move-hover");
      });
    }

    function updateHoveredMoveOutline(h3Index) {
      clearHoveredMoveOutline();
      if (!canClickStageMode()) {
        return;
      }
      const check = state.orderMode === "attack"
        ? canStageAttack(h3Index)
        : (state.orderMode === "besiege" ? canStageBesiege(h3Index) : canStageMove(h3Index));
      if (!h3Index || !check.ok) {
        return;
      }
      const polys = els.mapCanvas.querySelectorAll(".cell-poly");
      for (const poly of polys) {
        if ((poly.dataset.h3 || "") === h3Index) {
          poly.classList.add("valid-move-hover");
          break;
        }
      }
    }

    function canClickStageMode() {
      if (!state.token || !state.view) {
        return false;
      }
      if (String(state.view?.current_action?.kind || "").trim().toLowerCase() === "rout") {
        return false;
      }
      if (!["march", "attack", "besiege"].includes(state.orderMode)) {
        return false;
      }
      if (!state.ordersPanelExpanded) {
        return false;
      }
      return true;
    }

    async function stageMoveToCell(h3Index, { silent = false } = {}) {
      if (!h3Index) {
        if (!silent) {
          setStatus("No cell selected.", true);
        }
        return false;
      }
      if (state.orderMode === "attack") {
        const check = canStageAttack(h3Index);
        if (!check.ok) {
          if (!silent) {
            setStatus(check.reason, true);
          }
          return false;
        }
        const target = state.validAttackTargets.get(String(h3Index));
        if (!target) {
          if (!silent) {
            setStatus("No valid target found in selected cell.", true);
          }
          return false;
        }
        state.stagedAttack = { ...target };
        renderOrdersPanel();
        await refreshValidAttackTargets();
        renderMap();
        return true;
      }
      if (state.orderMode === "besiege") {
        const check = canStageBesiege(h3Index);
        if (!check.ok) {
          if (!silent) {
            setStatus(check.reason, true);
          }
          return false;
        }
        const target = state.validBesiegeTargets.get(String(h3Index));
        if (!target) {
          if (!silent) {
            setStatus("No valid stronghold found in selected cell.", true);
          }
          return false;
        }
        state.stagedSiege = { ...target };
        renderOrdersPanel();
        await refreshValidBesiegeTargets();
        renderMap();
        return true;
      }

      const check = canStageMove(h3Index);
      if (!check.ok) {
        if (!silent) {
          setStatus(check.reason, true);
        }
        return false;
      }
      state.stagedPath.push(h3Index);
      renderStagedPathList();
      await refreshOrderTargets();
      renderMap();
      return true;
    }

    function terrainKey(value) {
      return String(value || "unknown").trim().toLowerCase();
    }

    function terrainColor(terrainType) {
      return TERRAIN_COLORS[terrainKey(terrainType)] || "var(--unknown)";
    }

    function parseBoundary(boundary) {
      return boundary.map((point) => {
        if (Array.isArray(point)) {
          return { lat: point[0], lng: point[1] };
        }
        return { lat: point.lat, lng: point.lng };
      });
    }

    function cellBoundary(h3Index) {
      if (window.h3.cellToBoundary) {
        return parseBoundary(window.h3.cellToBoundary(h3Index));
      }
      if (window.h3.h3ToGeoBoundary) {
        return parseBoundary(window.h3.h3ToGeoBoundary(h3Index, true));
      }
      throw new Error("h3 boundary function unavailable");
    }

    function cellCenter(h3Index) {
      if (window.h3.cellToLatLng) {
        const [lat, lng] = window.h3.cellToLatLng(h3Index);
        return { lat, lng };
      }
      if (window.h3.h3ToGeo) {
        const [lat, lng] = window.h3.h3ToGeo(h3Index);
        return { lat, lng };
      }
      throw new Error("h3 center function unavailable");
    }

    function areNeighborCells(a, b) {
      if (window.h3.areNeighborCells) {
        return window.h3.areNeighborCells(a, b);
      }
      if (window.h3.h3IndexesAreNeighbors) {
        return window.h3.h3IndexesAreNeighbors(a, b);
      }
      return false;
    }

    function neighborCells(h3Index) {
      if (window.h3.gridDisk) {
        const disk = window.h3.gridDisk(h3Index, 1);
        return disk.filter((value) => value !== h3Index);
      }
      return [];
    }

    async function api(path, options = {}, useAuth = false) {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      if (useAuth && state.token) {
        headers["Authorization"] = `Bearer ${state.token}`;
      }
      const response = await fetch(path, { ...options, headers });
      const contentType = response.headers.get("content-type") || "";
      const data = contentType.includes("application/json") ? await response.json() : await response.text();
      if (!response.ok) {
        throw new Error(typeof data === "object" ? JSON.stringify(data) : data);
      }
      return data;
    }

    function readableErrorMessage(err) {
      const raw = String(err?.message || err || "").trim();
      if (!raw) {
        return "Unknown error";
      }
      try {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object" && typeof parsed.detail === "string" && parsed.detail.trim()) {
          return parsed.detail.trim();
        }
      } catch (_) {}
      return raw;
    }

    async function loadCommanders() {
      const commanders = await api("/v1/commanders");
      const options = ["<option value=''>Select commander...</option>"];
      for (const cmd of commanders) {
        const label = cmd.display_name || cmd.name;
        options.push(`<option value="${cmd.name}">${label}</option>`);
      }
      els.commanderSelect.innerHTML = options.join("");
    }

    async function loginCommander(commanderName) {
      const payload = await api("/v1/auth/login", {
        method: "POST",
        body: JSON.stringify({ commander_name: commanderName }),
      });
      state.token = payload.token;
      state.selectedCommander = payload.commander.name;
      state.sessionVersion += 1;
    }

    function snapshotSession() {
      return {
        token: state.token,
        version: state.sessionVersion,
      };
    }

    function isCurrentSession(snapshot) {
      return !!snapshot && snapshot.token === state.token && snapshot.version === state.sessionVersion;
    }

    function renderCorrespondents() {
      const previousValue = els.recipientSelect.value;
      if (!state.correspondents.length) {
        els.recipientSelect.innerHTML = "<option value=\"\">No correspondents</option>";
        return;
      }
      const rows = state.correspondents.map(
        (c) => `<option value="${c.id}">${c.display_name || c.name}</option>`
      );
      els.recipientSelect.innerHTML = rows.join("");
      if (previousValue && state.correspondents.some((c) => c.id === previousValue)) {
        els.recipientSelect.value = previousValue;
      }
    }

    async function refreshCorrespondents() {
      if (!state.token) {
        state.correspondents = [];
        renderCorrespondents();
        return;
      }
      const sessionSnapshot = snapshotSession();
      const correspondents = await api("/v1/correspondents", {}, true);
      if (!isCurrentSession(sessionSnapshot)) {
        return;
      }
      state.correspondents = correspondents;
      renderCorrespondents();
    }

    function renderInbox() {
      if (!state.inbox.length) {
        els.inboxList.innerHTML = "<li class=\"inbox-item\"><div class=\"inbox-btn\">No received letters yet.</div></li>";
        return;
      }
      const rows = state.inbox.map((msg) => {
        const unreadClass = msg.is_read ? "" : " unread";
        const marker = msg.is_read ? "" : "[UNREAD] ";
        const sentDay = Number(msg?.sent_watch?.day);
        const dayText = Number.isFinite(sentDay) ? `, ${formatScenarioDate(sentDay)}` : "";
        return (
          `<li class="inbox-item">` +
          `<button class="inbox-btn${unreadClass}" data-msg-id="${msg.id}" type="button">` +
          `${marker}${msg.from.name}${dayText}` +
          `</button>` +
          `</li>`
        );
      });
      els.inboxList.innerHTML = rows.join("");
        els.inboxList.querySelectorAll(".inbox-btn[data-msg-id]").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const messageId = btn.dataset.msgId;
          try {
            const message = await api(`/v1/me/messages/${messageId}`, {}, true);
            state.openMessageId = message.id;
            const sentWatchName = watchDisplayName(message?.sent_watch?.watch);
            const deliveredWatchName = watchDisplayName(message?.delivered_watch?.watch);
            const sentDateText = formatScenarioDate(message?.sent_watch?.day);
            const deliveredDateText = formatScenarioDate(message?.delivered_watch?.day);
            els.messageRead.textContent =
              `From: ${message.from.name}\n` +
              `Sent: ${sentDateText}, ${sentWatchName}\n` +
              `Delivered: ${deliveredDateText}, ${deliveredWatchName}\n\n` +
              `${message.content}`;
            await refreshInbox();
            await refreshAlerts();
          } catch (err) {
            setStatus(`Read failed: ${err.message}`, true);
          }
        });
      });
    }

    async function refreshInbox() {
      if (!state.token) {
        state.inbox = [];
        state.openMessageId = null;
        els.messageRead.textContent = "Select a letter to read.";
        renderInbox();
        return;
      }
      const sessionSnapshot = snapshotSession();
      const nextInbox = await api("/v1/me/messages", {}, true);
      if (!isCurrentSession(sessionSnapshot)) {
        return;
      }
      state.inbox = nextInbox;
      renderInbox();
    }

    async function refreshAlerts() {
      if (!state.token) {
        state.alerts = [];
        renderAlerts();
        return;
      }
      const sessionSnapshot = snapshotSession();
      const rows = await api("/v1/me/alerts?limit=25", {}, true);
      if (!isCurrentSession(sessionSnapshot)) {
        return;
      }
      const currentDay = Number(state.view?.time?.day);
      const currentWatch = Number(state.view?.time?.watch);
      const isCurrentWatchKnown = Number.isFinite(currentDay) && Number.isFinite(currentWatch);

      const stateCurrent = [];
      const events = [];
      const unreadInboxCount = state.inbox.reduce((count, message) => (
        message && message.is_read === false ? count + 1 : count
      ), 0);
      for (const item of rows) {
        const rawMessage = String(item?.message || "").trim();
        if (!rawMessage) {
          continue;
        }
        const importance = String(item?.importance || "normal").toLowerCase();
        const signalKind = String(item?.signal_kind || "event").toLowerCase();
        const category = String(item?.category || "").toLowerCase();
        const createdDay = Number(item?.created_watch?.day);
        const createdWatch = Number(item?.created_watch?.watch);
        const deliveredDay = Number(item?.delivered_watch?.day);
        const deliveredWatch = Number(item?.delivered_watch?.watch);

        if (signalKind === "state") {
          if (!isCurrentWatchKnown || createdDay !== currentDay || createdWatch !== currentWatch) {
            continue; // stale state alerts are hidden
          }
          stateCurrent.push({
            message: normalizeAlertMessage(rawMessage),
            heading: "",
            importance,
            signal_kind: "state",
          });
          continue;
        }

        if ((category === "orders" || category === "standing-order") && isCurrentWatchKnown) {
          const age = watchStampAge(currentDay, currentWatch, createdDay, createdWatch);
          if (age !== null && age >= 5) {
            continue;
          }
        }

        const hasDeliveredStamp = Number.isFinite(deliveredDay) && Number.isFinite(deliveredWatch);
        const eventHeading = hasDeliveredStamp
          ? `${formatScenarioDateNoYear(deliveredDay)}, ${formatWatchLabelLower(deliveredWatch)}`
          : "";
        events.push({
          message: normalizeAlertMessage(rawMessage),
          heading: eventHeading,
          importance,
          signal_kind: "event",
        });
      }

      if (unreadInboxCount > 0) {
        stateCurrent.unshift({
          message: unreadInboxCount >= 5 ? "5+ unread letters" : `${unreadInboxCount} unread letters`,
          heading: "",
          importance: unreadInboxCount >= 5 ? "high" : "moderate",
          signal_kind: "state",
        });
      }

      state.alerts = [...stateCurrent, ...events];
      renderAlerts();
    }

    function projectCells(cells, width, height) {
      const raw = [];
      let minX = Infinity;
      let maxX = -Infinity;
      let minY = Infinity;
      let maxY = -Infinity;

      for (const cell of cells) {
        const center = cellCenter(cell.h3);
        const boundary = cellBoundary(cell.h3);
        const centerX = center.lng * Math.cos((center.lat * Math.PI) / 180);
        const centerY = -center.lat;

        const poly = boundary.map((p) => {
          const x = p.lng * Math.cos((p.lat * Math.PI) / 180);
          const y = -p.lat;
          minX = Math.min(minX, x);
          maxX = Math.max(maxX, x);
          minY = Math.min(minY, y);
          maxY = Math.max(maxY, y);
          return { x, y };
        });

        raw.push({ cell, centerLat: center.lat, centerLng: center.lng, centerX, centerY, poly });
      }

      const pad = 36;
      const dx = Math.max(maxX - minX, 1e-6);
      const dy = Math.max(maxY - minY, 1e-6);
      const scale = Math.min((width - pad * 2) / dx, (height - pad * 2) / dy);
      const toScreen = (lat, lng) => ({
        x: pad + ((lng * Math.cos((lat * Math.PI) / 180)) - minX) * scale,
        y: pad + ((-lat) - minY) * scale,
      });

      const projected = raw.map((item) => ({
        cell: item.cell,
        center: toScreen(item.centerLat, item.centerLng),
        poly: item.poly.map((p) => ({
          x: pad + (p.x - minX) * scale,
          y: pad + (p.y - minY) * scale,
        })),
        scale,
      }));
      return { projected, toScreen };
    }

    function rayPolygonBoundaryPoint(center, dir, polygon) {
      const eps = 1e-6;
      let bestT = Infinity;
      let bestPoint = null;

      const cross = (ax, ay, bx, by) => ax * by - ay * bx;

      for (let i = 0; i < polygon.length; i += 1) {
        const a = polygon[i];
        const b = polygon[(i + 1) % polygon.length];
        const sx = b.x - a.x;
        const sy = b.y - a.y;
        const qpx = a.x - center.x;
        const qpy = a.y - center.y;

        const denom = cross(dir.x, dir.y, sx, sy);
        if (Math.abs(denom) < eps) {
          continue;
        }
        const t = cross(qpx, qpy, sx, sy) / denom;
        const u = cross(qpx, qpy, dir.x, dir.y) / denom;
        if (t > eps && u >= -eps && u <= 1 + eps && t < bestT) {
          bestT = t;
          bestPoint = { x: center.x + dir.x * t, y: center.y + dir.y * t };
        }
      }

      return bestPoint;
    }

    function renderMap() {
      const view = state.view;
      if (!view || !view.environs || !Array.isArray(view.environs.cells)) {
        els.mapCanvas.innerHTML = "";
        return;
      }
      const cells = view.environs.cells;
      const width = state.mapWidth;
      const height = state.mapHeight;
      els.mapCanvas.setAttribute("viewBox", `0 0 ${width} ${height}`);

      const projection = projectCells(cells, width, height);
      const projected = projection.projected;
      state.projectedCells = projected;

      const polygons = [];
      let centerPolygon = "";
      const stagedOverlays = [];
      const itineraryOverlays = [];
      const routOverlays = [];
      const attackOverlays = [];
      const siegeOverlays = [];
      const roadLines = [];
      const strongholdIcons = [];
      const otherArmyIcons = [];
      const centerByH3 = new Map();
      const stagedAttackH3 = state.orderMode === "attack" && state.stagedAttack
        ? String(state.stagedAttack.target_h3 || "").trim()
        : "";
      const stagedSiegeH3 = state.orderMode === "besiege" && state.stagedSiege
        ? String(state.stagedSiege.target_h3 || "").trim()
        : "";
      const stagedIndexByH3 = new Map(state.stagedPath.map((h3Index, idx) => [h3Index, idx + 1]));
      if (stagedAttackH3) {
        stagedIndexByH3.set(stagedAttackH3, 1);
      }
      if (stagedSiegeH3) {
        stagedIndexByH3.set(stagedSiegeH3, 1);
      }
      const itineraryIndexByH3 = new Map(
        state.remainingItinerary
          .filter((h3Index) => !stagedIndexByH3.has(h3Index))
          .map((h3Index, idx) => [h3Index, idx + 1])
      );
      const routIndexByH3 = new Map(
        state.remainingRout
          .filter((h3Index) => !stagedIndexByH3.has(h3Index))
          .map((h3Index, idx) => [h3Index, idx + 1])
      );
      const queuedAttackH3 = String(
        view?.current_action?.kind === "attack"
          ? (view?.current_action?.target_h3 || "")
          : ""
      ).trim();
      const queuedSiegeH3 = String(view?.itinerary?.siege_target_h3 || "").trim();

      for (const item of projected) {
        centerByH3.set(item.cell.h3, item.center);
      }
      const polyByH3 = new Map();
      for (const item of projected) {
        polyByH3.set(item.cell.h3, item.poly);
      }

      const roadCells = cells.filter((cell) => cell.has_road).map((cell) => cell.h3);
      const uniqueRoadPairs = new Set();
      const adjacency = new Map();
      const addNeighbor = (a, b) => {
        if (!adjacency.has(a)) {
          adjacency.set(a, new Set());
        }
        adjacency.get(a).add(b);
      };
      const edgeKey = (a, b) => (a < b ? `${a}|${b}` : `${b}|${a}`);
      for (let i = 0; i < roadCells.length; i += 1) {
        for (let j = i + 1; j < roadCells.length; j += 1) {
          const a = roadCells[i];
          const b = roadCells[j];
          if (!areNeighborCells(a, b)) {
            continue;
          }
          const pair = edgeKey(a, b);
          uniqueRoadPairs.add(pair);
          addNeighbor(a, b);
          addNeighbor(b, a);
        }
      }

      // Build centerline-style Y junctions for triangle artifacts where 3 adjacent road cells
      // share a common polygon corner. Those triangle edges are suppressed.
      const triangleEdgesToSkip = new Set();
      const triangleSpokes = [];
      const triangleSpokeKeys = new Set();
      const findCommonVertex = (polyA, polyB, polyC, tolerance = 1.4) => {
        for (const va of polyA || []) {
          for (const vb of polyB || []) {
            if (Math.hypot(va.x - vb.x, va.y - vb.y) > tolerance) {
              continue;
            }
            for (const vc of polyC || []) {
              if (Math.hypot(va.x - vc.x, va.y - vc.y) <= tolerance && Math.hypot(vb.x - vc.x, vb.y - vc.y) <= tolerance) {
                return {
                  x: (va.x + vb.x + vc.x) / 3,
                  y: (va.y + vb.y + vc.y) / 3,
                };
              }
            }
          }
        }
        return null;
      };

      const sortedRoadCells = [...roadCells].sort();
      for (let i = 0; i < sortedRoadCells.length; i += 1) {
        const a = sortedRoadCells[i];
        const na = adjacency.get(a) || new Set();
        for (let j = i + 1; j < sortedRoadCells.length; j += 1) {
          const b = sortedRoadCells[j];
          if (!na.has(b)) {
            continue;
          }
          const nb = adjacency.get(b) || new Set();
          for (let k = j + 1; k < sortedRoadCells.length; k += 1) {
            const c = sortedRoadCells[k];
            if (!na.has(c) || !nb.has(c)) {
              continue;
            }
            const common = findCommonVertex(polyByH3.get(a), polyByH3.get(b), polyByH3.get(c));
            if (!common) {
              continue;
            }
            triangleEdgesToSkip.add(edgeKey(a, b));
            triangleEdgesToSkip.add(edgeKey(a, c));
            triangleEdgesToSkip.add(edgeKey(b, c));
            for (const node of [a, b, c]) {
              const center = centerByH3.get(node);
              if (!center) {
                continue;
              }
              const key = `${Math.round(center.x)}:${Math.round(center.y)}:${Math.round(common.x)}:${Math.round(common.y)}`;
              if (triangleSpokeKeys.has(key)) {
                continue;
              }
              triangleSpokeKeys.add(key);
              triangleSpokes.push({ from: center, to: common });
            }
          }
        }
      }

      for (const pair of uniqueRoadPairs) {
        if (triangleEdgesToSkip.has(pair)) {
          continue;
        }
        const [a, b] = pair.split("|");
        const c1 = centerByH3.get(a);
        const c2 = centerByH3.get(b);
        if (!c1 || !c2) {
          continue;
        }
        roadLines.push(
          `<line x1="${c1.x.toFixed(1)}" y1="${c1.y.toFixed(1)}" x2="${c2.x.toFixed(1)}" y2="${c2.y.toFixed(1)}" stroke="#8b5a2b" stroke-width="3.2" stroke-linecap="round" opacity="0.9" pointer-events="none" />`
        );
      }
      for (const spoke of triangleSpokes) {
        roadLines.push(
          `<line x1="${spoke.from.x.toFixed(1)}" y1="${spoke.from.y.toFixed(1)}" x2="${spoke.to.x.toFixed(1)}" y2="${spoke.to.y.toFixed(1)}" stroke="#8b5a2b" stroke-width="3.2" stroke-linecap="round" opacity="0.9" pointer-events="none" />`
        );
      }

      // Border stubs: visible road cell -> off-environs adjacent road cell.
      const visibleSet = new Set(cells.map((cell) => cell.h3));
      const borderRoadSet = state.borderRoadNeighbors || new Set();
      for (const roadCell of roadCells) {
        const c1 = centerByH3.get(roadCell);
        const originPoly = polyByH3.get(roadCell);
        if (!c1) {
          continue;
        }
        if (!originPoly || originPoly.length < 3) {
          continue;
        }
        for (const neighbor of neighborCells(roadCell)) {
          if (visibleSet.has(neighbor)) {
            continue;
          }
          if (!borderRoadSet.has(neighbor)) {
            continue;
          }
          const geo = cellCenter(neighbor);
          const c2 = projection.toScreen(geo.lat, geo.lng);
          const dx = c2.x - c1.x;
          const dy = c2.y - c1.y;
          const length = Math.hypot(dx, dy);
          if (length < 1e-6) {
            continue;
          }
          const dir = { x: dx / length, y: dy / length };
          const edgePoint = rayPolygonBoundaryPoint(c1, dir, originPoly);
          if (!edgePoint) {
            continue;
          }
          roadLines.push(
            `<line x1="${c1.x.toFixed(1)}" y1="${c1.y.toFixed(1)}" x2="${edgePoint.x.toFixed(1)}" y2="${edgePoint.y.toFixed(1)}" stroke="#8b5a2b" stroke-width="3.2" stroke-linecap="round" opacity="0.9" pointer-events="none" />`
          );
        }
      }

      for (const item of projected) {
        const points = item.poly.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
        const isCenter = item.cell.h3 === view.environs.center_h3;
        const polyClass = isCenter ? "cell-poly center-cell" : "cell-poly";
        const polygon = `<polygon class="${polyClass}" data-h3="${item.cell.h3}" points="${points}" fill="${terrainColor(item.cell.terrain_type)}" opacity="0.94" />`;
        if (isCenter) {
          centerPolygon = polygon;
        } else {
          polygons.push(polygon);
        }

        if (item.cell.stronghold && item.cell.stronghold.name) {
          const strongholdType = String(item.cell.stronghold.type || "").trim().toLowerCase();
          const iconHref = STRONGHOLD_ICON_BY_TYPE[strongholdType];
          if (iconHref) {
            const xs = item.poly.map((p) => p.x);
            const ys = item.poly.map((p) => p.y);
            const cellWidth = Math.max(...xs) - Math.min(...xs);
            const cellHeight = Math.max(...ys) - Math.min(...ys);
            const baseScale = 0.82;
            const typeScale = STRONGHOLD_ICON_SCALE_BY_TYPE[strongholdType] || 1.0;
            const iconSize = Math.max(20, Math.min(cellWidth, cellHeight) * baseScale * typeScale);
            const iconX = item.center.x - iconSize / 2;
            const yOffsetFactor = STRONGHOLD_ICON_Y_OFFSET_BY_TYPE[strongholdType] || 0.0;
            const iconY = item.center.y - iconSize / 2 + iconSize * yOffsetFactor;
            strongholdIcons.push(
              `<image href="${iconHref}" x="${iconX.toFixed(1)}" y="${iconY.toFixed(1)}" width="${iconSize.toFixed(1)}" height="${iconSize.toFixed(1)}" preserveAspectRatio="xMidYMid meet" pointer-events="none" />`
            );
          }
        }

        const otherArmies = Array.isArray(item.cell.other_armies) ? item.cell.other_armies : [];
        if (otherArmies.length > 0) {
          const xs = item.poly.map((p) => p.x);
          const ys = item.poly.map((p) => p.y);
          const cellWidth = Math.max(...xs) - Math.min(...xs);
          const cellHeight = Math.max(...ys) - Math.min(...ys);
          const iconSize = Math.max(14, Math.min(cellWidth, cellHeight) * 0.34);
          const iconX = item.center.x - iconSize / 2;
          const iconY = item.center.y - iconSize / 2;
          const isStrongholdCell = !!(item.cell.stronghold && item.cell.stronghold.name);
          if (isStrongholdCell) {
            const backerSize = iconSize * 1.22;
            const backerX = item.center.x - backerSize / 2;
            const backerY = item.center.y - backerSize / 2;
            otherArmyIcons.push(
              `<image href="${OTHER_ARMY_ICON_WHITE}" x="${backerX.toFixed(1)}" y="${backerY.toFixed(1)}" width="${backerSize.toFixed(1)}" height="${backerSize.toFixed(1)}" preserveAspectRatio="xMidYMid meet" pointer-events="none" />`
            );
          }
          otherArmyIcons.push(
            `<image href="${OTHER_ARMY_ICON}" x="${iconX.toFixed(1)}" y="${iconY.toFixed(1)}" width="${iconSize.toFixed(1)}" height="${iconSize.toFixed(1)}" preserveAspectRatio="xMidYMid meet" pointer-events="none" />`
          );
        }

        const stagedNumber = stagedIndexByH3.get(item.cell.h3);
        if (stagedNumber) {
          const stagedPoints = item.poly.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
          stagedOverlays.push(
            `<polygon points="${stagedPoints}" fill="none" stroke="#d7891f" stroke-width="2.4" stroke-linejoin="round" opacity="0.95" pointer-events="none" />`
          );
        }

        const itineraryNumber = itineraryIndexByH3.get(item.cell.h3);
        if (itineraryNumber) {
          const itineraryPoints = item.poly.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
          itineraryOverlays.push(
            `<polygon points="${itineraryPoints}" fill="none" stroke="#2a6ea8" stroke-width="2.0" stroke-dasharray="6 4" stroke-linejoin="round" opacity="0.9" pointer-events="none" />`
          );
        }

        const routNumber = routIndexByH3.get(item.cell.h3);
        if (routNumber) {
          const routPoints = item.poly.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
          routOverlays.push(
            `<polygon points="${routPoints}" fill="none" stroke="#a85a1a" stroke-width="2.0" stroke-dasharray="6 4" stroke-linejoin="round" opacity="0.92" pointer-events="none" />`
          );
        }

        if (queuedAttackH3 && item.cell.h3 === queuedAttackH3) {
          const attackPoints = item.poly.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
          attackOverlays.push(
            `<polygon points="${attackPoints}" fill="none" stroke="#b53333" stroke-width="2.2" stroke-dasharray="6 4" stroke-linejoin="round" opacity="0.95" pointer-events="none" />`
          );
        }
        if (queuedSiegeH3 && item.cell.h3 === queuedSiegeH3) {
          const siegePoints = item.poly.map((p) => `${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" ");
          siegeOverlays.push(
            `<polygon points="${siegePoints}" fill="none" stroke="#7f3c8d" stroke-width="2.2" stroke-dasharray="6 4" stroke-linejoin="round" opacity="0.95" pointer-events="none" />`
          );
        }
      }

      if (centerPolygon) {
        polygons.push(centerPolygon);
      }
      els.mapCanvas.innerHTML =
        `<g>${polygons.join("")}</g>` +
        `<g>${roadLines.join("")}</g>` +
        `<g>${strongholdIcons.join("")}</g>` +
        `<g>${otherArmyIcons.join("")}</g>` +
        `<g>${itineraryOverlays.join("")}</g>` +
        `<g>${routOverlays.join("")}</g>` +
        `<g>${attackOverlays.join("")}</g>` +
        `<g>${siegeOverlays.join("")}</g>` +
        `<g>${stagedOverlays.join("")}</g>`;
      bindHoverHandlers();
      updateHoveredMoveOutline(state.hoverH3);
    }

    function hideHoverCard() {
      state.hoverH3 = null;
      els.hoverCard.style.display = "none";
      clearHoveredMoveOutline();
    }

    function positionHoverCard(clientX, clientY) {
      const panelRect = els.mapPanel.getBoundingClientRect();
      const cardRect = els.hoverCard.getBoundingClientRect();
      const margin = 12;
      let x = clientX - panelRect.left + 14;
      let y = clientY - panelRect.top + 14;
      if (x + cardRect.width + margin > panelRect.width) {
        x = panelRect.width - cardRect.width - margin;
      }
      if (y + cardRect.height + margin > panelRect.height) {
        y = panelRect.height - cardRect.height - margin;
      }
      x = Math.max(margin, x);
      y = Math.max(margin, y);
      els.hoverCard.style.left = `${x}px`;
      els.hoverCard.style.top = `${y}px`;
    }

    function showHoverCard(h3Index, clientX, clientY) {
      state.hoverH3 = h3Index;
      const cell = state.view?.environs?.cells?.find((c) => c.h3 === h3Index);
      if (cell) {
        const terrain = cell.terrain_type || "unknown";
        const settlementText = cell.settlement == null ? "0" : String(cell.settlement);
        const foragedText = cell.foraged_this_season ? "yes" : "no";
        const hasStronghold = !!(cell.stronghold && cell.stronghold.name);
        const otherArmies = Array.isArray(cell.other_armies) ? cell.other_armies : [];
        const primaryArmy = otherArmies.length ? otherArmies[0] : null;
        let strongholdTypeText = "none";
        let strongholdFactionText = "none";
        let siegeText = "no";
        let gatesText = "unknown";
        if (cell.stronghold && cell.stronghold.type) {
          strongholdTypeText = String(cell.stronghold.type);
        }
        if (hasStronghold && cell.stronghold && cell.stronghold.faction) {
          strongholdFactionText = String(cell.stronghold.faction);
        } else if (!hasStronghold && cell.region_control) {
          strongholdFactionText = String(cell.region_control);
        }
        if (cell.stronghold?.under_siege) {
          siegeText = "yes";
          if (typeof cell.stronghold?.siege?.gates_open === "boolean") {
            gatesText = cell.stronghold.siege.gates_open ? "open" : "closed";
          }
        }
        els.hoverTitle.innerHTML = buildHoverTitleHtml(cell);
        if (hasStronghold) {
          els.hoverTitle.classList.add("stronghold");
        } else {
          els.hoverTitle.classList.remove("stronghold");
        }
        const metaRows = [];
        const strongholdDefenderStrength = Number(cell?.stronghold?.defender_strength);
        if (hasStronghold && Number.isFinite(strongholdDefenderStrength)) {
          metaRows.push(`<div><span class=\"k\">Garrison:</span>${strongholdDefenderStrength.toLocaleString()}</div>`);
        }
        if (primaryArmy) {
          const visibleStrength = visibleArmyStrengthTotal(otherArmies);
          if (visibleStrength !== null && !hasStronghold) {
            const strengthLabel = "Strength:";
            metaRows.push(`<div><span class=\"k\">${strengthLabel}</span>${visibleStrength.toLocaleString()}</div>`);
          }
          if (primaryArmy.commander) {
            metaRows.push(`<div><span class=\"k\">Commanded By:</span>${escapeHtml(String(primaryArmy.commander))}</div>`);
          }
        }
        metaRows.push(
          `<div><span class=\"k\">Terrain:</span>${escapeHtml(terrain)}</div>`,
          `<div><span class=\"k\">Stronghold Type:</span>${escapeHtml(strongholdTypeText)}</div>`,
          `<div><span class=\"k\">Faction:</span>${escapeHtml(strongholdFactionText)}</div>`,
          `<div><span class=\"k\">Under Siege:</span>${escapeHtml(siegeText)}</div>`
        );
        if (siegeText === "yes") {
          metaRows.push(`<div><span class=\"k\">Gates:</span>${escapeHtml(gatesText)}</div>`);
        }
        metaRows.push(
          `<div><span class=\"k\">Settlement:</span>${escapeHtml(settlementText)}</div>`,
          `<div><span class=\"k\">Foraged This Season:</span>${escapeHtml(foragedText)}</div>`
        );
        els.hoverMeta.innerHTML = metaRows.join("");
        updateStageMoveButtonVisibility(h3Index);
        updateHoveredMoveOutline(h3Index);
      } else {
        els.hoverTitle.textContent = "Cell";
        els.hoverTitle.classList.remove("stronghold");
        els.hoverMeta.innerHTML = "";
        updateStageMoveButtonVisibility(null);
        updateHoveredMoveOutline(null);
      }
      els.hoverCard.style.display = "block";
      positionHoverCard(clientX, clientY);
    }

    function bindHoverHandlers() {
      const polys = els.mapCanvas.querySelectorAll(".cell-poly");
      polys.forEach((poly) => {
        poly.addEventListener("mouseenter", (event) => {
          showHoverCard(poly.dataset.h3 || "", event.clientX, event.clientY);
        });
        poly.addEventListener("mousemove", (event) => {
          if (els.hoverCard.style.display === "block") {
            positionHoverCard(event.clientX, event.clientY);
          }
        });
        poly.addEventListener("mouseleave", () => {
          hideHoverCard();
        });
        poly.addEventListener("click", async (event) => {
          event.stopPropagation();
          if (!canClickStageMode()) {
            return;
          }
          const h3Index = poly.dataset.h3 || "";
          await stageMoveToCell(h3Index, { silent: state.orderMode !== "attack" });
        });
      });
    }

    function updateMetadata(view) {
      if (!view) {
        els.timeText.textContent = "-";
        els.centerText.textContent = "-";
        els.conditionText.textContent = "-";
        els.radiusText.textContent = "-";
        return;
      }
      const calendarDate = formatScenarioDate(view?.time?.day);
      els.timeText.textContent = `${calendarDate}, ${watchDisplayName(view.time.watch)}`;
      const centerCell = (view.environs.cells || []).find((cell) => cell.h3 === view.environs.center_h3);
      els.centerText.textContent = String(centerCell?.cell_title || view.environs.center_h3 || "-");
      els.conditionText.textContent = armyConditionText(view);
      els.radiusText.textContent = `${view.environs.radius} leagues`;
    }

    async function refreshView() {
      if (!state.token) {
        return;
      }
      const sessionSnapshot = snapshotSession();
      const view = await api("/v1/me/view", {}, true);
      if (!isCurrentSession(sessionSnapshot)) {
        return;
      }
      const cellsParam = encodeURIComponent(view.environs.cells.map((cell) => cell.h3).join(","));
      const borderRoads = await api(`/v1/me/roads/border?cells=${cellsParam}`, {}, true);
      if (!isCurrentSession(sessionSnapshot)) {
        return;
      }
      state.view = view;
      state.remainingItinerary = Array.isArray(view?.itinerary?.remaining_moves) ? view.itinerary.remaining_moves.map(String) : [];
      state.remainingRout = Array.isArray(view?.itinerary?.remaining_rout) ? view.itinerary.remaining_rout.map(String) : [];
      state.remainingSiegeTarget = String(view?.itinerary?.siege_target_h3 || "").trim();
      state.borderRoadNeighbors = new Set((borderRoads.roads || []).map((value) => String(value)));
      processStandingOrderState(view);
      updateMetadata(view);
      renderArmyStatusSection(view);
      renderSupplyStatusSection(view);
      renderOrdersStatusSection(view);
      renderOrdersPanel();
      try {
        await refreshOrderTargets();
      } catch (err) {
        setStatus(`Attack target lookup failed: ${err.message}`, true);
      }
      renderMap();
    }

    async function refreshAllPanels() {
      if (state.refreshInFlight) {
        return;
      }
      state.refreshInFlight = true;
      try {
      await refreshView();
      await refreshArmyManagementState({ preserveDraft: true });
      await refreshCorrespondents();
      await refreshInbox();
      await refreshAlerts();
      } finally {
        state.refreshInFlight = false;
      }
    }

    function openOrdersPane() {
      state.ordersPanelExpanded = true;
      renderOrdersStatusSection(state.view);
      updateHoveredMoveOutline(state.hoverH3);
    }

    function closeOrdersPane() {
      state.ordersPanelExpanded = false;
      renderOrdersStatusSection(state.view);
      updateHoveredMoveOutline(state.hoverH3);
    }

    function toggleOrdersPane() {
      if (!state.ordersPanelExpanded) {
        openOrdersPane();
      } else {
        closeOrdersPane();
      }
    }

    async function setOrderModeFromShortcut(mode) {
      openOrdersPane();
      const nextMode = String(mode || "march").trim().toLowerCase();
      if (nextMode === "forage" && !isNightOrMatinWatch()) {
        state.orderMode = "march";
        renderOrdersPanel();
        return;
      }
      if (nextMode === "attack") {
        state.orderMode = "attack";
      } else if (nextMode === "besiege") {
        state.orderMode = "besiege";
      } else if (nextMode === "forage") {
        state.orderMode = "forage";
      } else {
        state.orderMode = "march";
      }
      els.orderModeSelect.value = state.orderMode;
      if (state.orderMode === "forage") {
        state.stagedPath = [];
        state.stagedAttack = null;
        state.stagedSiege = null;
        state.validNextMoves = new Set();
        state.validAttackTargets = new Map();
        state.validBesiegeTargets = new Map();
        renderMap();
      } else if (state.orderMode === "attack") {
        state.stagedPath = [];
        state.stagedSiege = null;
        state.validNextMoves = new Set();
        state.validBesiegeTargets = new Map();
        renderMap();
      } else if (state.orderMode === "besiege") {
        state.stagedPath = [];
        state.stagedAttack = null;
        state.validNextMoves = new Set();
        state.validAttackTargets = new Map();
        renderMap();
      } else {
        state.stagedAttack = null;
        state.stagedSiege = null;
        state.validAttackTargets = new Map();
        state.validBesiegeTargets = new Map();
        renderMap();
      }
      renderOrdersPanel();
      await refreshOrderTargets();
    }

    els.commanderSelect.addEventListener("change", async (event) => {
      const commanderName = event.target.value;
      if (!commanderName) {
        state.sessionVersion += 1;
        state.token = null;
        state.selectedCommander = null;
        state.view = null;
        state.alerts = [];
        state.correspondents = [];
        state.inbox = [];
        state.openMessageId = null;
        state.followRoadEnabled = false;
        state.armyPanelExpanded = false;
        state.supplyPanelExpanded = false;
        state.ordersPanelExpanded = false;
        state.orderMode = "march";
        state.stagedPath = [];
        state.stagedAttack = null;
        state.stagedSiege = null;
        state.remainingItinerary = [];
        state.remainingRout = [];
        state.remainingSiegeTarget = "";
        state.validNextMoves = new Set();
        state.validAttackTargets = new Map();
        state.validBesiegeTargets = new Map();
        state.armyManagement = {
          open: false,
          loading: false,
          dirty: false,
          note: "",
          error: "",
          server: null,
          draft: null,
          drag: null,
          focus: null,
          scroll: null,
        };
        updateMetadata(null);
        renderArmyStatusSection(null);
        renderSupplyStatusSection(null);
        renderMap();
        renderOrdersPanel();
        renderOrdersStatusSection(null);
        renderStandingOrderToggle();
        renderAlerts();
        renderCorrespondents();
        renderInbox();
        els.composeBox.setAttribute("hidden", "");
        els.composeToggleBtn.textContent = "Send Letter";
        els.letterInput.value = "";
        els.messageRead.textContent = "Select a letter to read.";
        renderArmyManagementModal();
        setStatus("");
        return;
      }
      try {
        state.openMessageId = null;
        els.messageRead.textContent = "Select a letter to read.";
        state.alerts = [];
        renderAlerts();
        state.ordersPanelExpanded = false;
        await loginCommander(commanderName);
        state.orderMode = "march";
        state.stagedPath = [];
          state.stagedAttack = null;
          state.stagedSiege = null;
          state.remainingItinerary = [];
          state.remainingRout = [];
        state.remainingSiegeTarget = "";
        state.validNextMoves = new Set();
        state.validAttackTargets = new Map();
        state.validBesiegeTargets = new Map();
        state.armyManagement = {
          open: false,
          loading: false,
          dirty: false,
          note: "",
          error: "",
          server: null,
          draft: null,
          drag: null,
          focus: null,
          scroll: null,
        };
        state.followRoadEnabled = false;
        state.armyPanelExpanded = false;
        state.supplyPanelExpanded = false;
        state.ordersPanelExpanded = false;
        renderArmyManagementModal();
        await refreshAllPanels();
      } catch (err) {
        setStatus(`Login/load error: ${err.message}`, true);
      }
    });

    const resizeObserver = new ResizeObserver(() => {
      const rect = els.mapPanel.getBoundingClientRect();
      state.mapWidth = Math.max(600, Math.floor(rect.width - 2));
      state.mapHeight = Math.max(420, Math.floor(rect.height - 2));
      renderMap();
    });
    resizeObserver.observe(els.mapPanel);

    setInterval(async () => {
      if (!state.token) {
        return;
      }
      try {
        await refreshAllPanels();
      } catch (err) {
        setStatus(`Auto-refresh error: ${err.message}`, true);
      }
    }, 10000);

    (async function init() {
      renderAlerts();
      renderOrdersPanel();
      renderStandingOrderToggle();
      renderArmyStatusSection(null);
      renderSupplyStatusSection(null);
      renderOrdersStatusSection(null);
      els.armyStatusToggle.addEventListener("click", () => {
        state.armyPanelExpanded = !state.armyPanelExpanded;
        renderArmyStatusSection(state.view);
      });
      injectArmyManagementUi();
      renderArmyStatusSection(state.view);
      renderArmyManagementModal();
      els.manageArmyBtn.addEventListener("click", async () => {
        await openArmyManagementModal();
      });
      els.armyMgmtCloseBtn.addEventListener("click", () => closeArmyManagementModal(false));
      els.armyMgmtCancelBtn.addEventListener("click", () => closeArmyManagementModal(false));
      els.armyMgmtApplyBtn.addEventListener("click", async () => {
        await applyArmyManagementChanges();
      });
      els.armyMgmtOverlay.addEventListener("click", (event) => {
        if (event.target === els.armyMgmtOverlay) {
          closeArmyManagementModal(false);
        }
      });
      els.supplyStatusToggle.addEventListener("click", () => {
        state.supplyPanelExpanded = !state.supplyPanelExpanded;
        renderSupplyStatusSection(state.view);
      });
      els.ordersStatusToggle.addEventListener("click", () => toggleOrdersPane());
      els.followRoadToggleInput.addEventListener("change", async () => {
        if (!state.token) {
          setStatus("Select a commander first.", true);
          els.followRoadToggleInput.checked = false;
          return;
        }
        try {
          const nextEnabled = !!els.followRoadToggleInput.checked;
          const payload = await api(
            "/v1/me/orders/standing/follow-road",
            {
              method: "POST",
              body: JSON.stringify({ enabled: nextEnabled }),
            },
            true
          );
          state.followRoadEnabled = !!payload?.follow_road?.enabled;
          renderStandingOrderToggle();
          await refreshAlerts();
        } catch (err) {
          renderStandingOrderToggle();
          setStatus(`Standing order update failed: ${err.message}`, true);
        }
      });
      els.queueMoveBtn.addEventListener("click", async () => {
        if (!state.token) {
          setStatus("Select a commander first.", true);
          return;
        }
        await stageMoveToCell(state.hoverH3);
      });
      els.orderModeSelect.addEventListener("change", async () => {
        const nextMode = String(els.orderModeSelect.value || "march").trim().toLowerCase();
        if (nextMode === "forage" && !isNightOrMatinWatch()) {
          state.orderMode = "march";
          renderOrdersPanel();
          return;
        }
        if (nextMode === "attack") {
          state.orderMode = "attack";
        } else if (nextMode === "besiege") {
          state.orderMode = "besiege";
        } else if (nextMode === "forage") {
          state.orderMode = "forage";
        } else {
          state.orderMode = "march";
        }
        if (state.orderMode === "forage") {
          state.stagedPath = [];
          state.stagedAttack = null;
          state.stagedSiege = null;
          state.validNextMoves = new Set();
          state.validAttackTargets = new Map();
          state.validBesiegeTargets = new Map();
          renderMap();
        } else if (state.orderMode === "attack") {
          state.stagedPath = [];
          state.stagedSiege = null;
          state.validNextMoves = new Set();
          state.validBesiegeTargets = new Map();
          renderMap();
        } else if (state.orderMode === "besiege") {
          state.stagedPath = [];
          state.stagedAttack = null;
          state.validNextMoves = new Set();
          state.validAttackTargets = new Map();
          renderMap();
        } else {
          state.stagedAttack = null;
          state.stagedSiege = null;
          state.validAttackTargets = new Map();
          state.validBesiegeTargets = new Map();
          renderMap();
        }
        renderOrdersPanel();
        try {
          await refreshOrderTargets();
        } catch (err) {
          setStatus(`Order target lookup failed: ${err.message}`, true);
        }
      });
      document.addEventListener("keydown", async (event) => {
        const key = String(event.key || "").toLowerCase();
        if (state.armyManagement.open && key === "escape") {
          event.preventDefault();
          closeArmyManagementModal(false);
          return;
        }
        if (state.armyManagement.open && key === "tab") {
          const focusable = Array.from(
            els.armyMgmtOverlay.querySelectorAll("button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled])")
          );
          if (focusable.length) {
            const first = focusable[0];
            const last = focusable[focusable.length - 1];
            if (event.shiftKey && document.activeElement === first) {
              event.preventDefault();
              last.focus();
              return;
            }
            if (!event.shiftKey && document.activeElement === last) {
              event.preventDefault();
              first.focus();
              return;
            }
          }
        }
        if (state.armyManagement.open) {
          return;
        }
        const target = event.target;
        const tag = target && target.tagName ? String(target.tagName).toUpperCase() : "";
        if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || (target && target.isContentEditable)) {
          return;
        }
        if (key === "m") {
          event.preventDefault();
          await setOrderModeFromShortcut("march");
          return;
        }
        if (key === "f") {
          event.preventDefault();
          await setOrderModeFromShortcut("forage");
          return;
        }
        if (key === "o") {
          event.preventDefault();
          toggleOrdersPane();
          return;
        }
        if (key === "enter" && state.ordersPanelExpanded) {
          event.preventDefault();
          els.submitOrdersBtn.click();
        }
      });
      els.submitOrdersBtn.addEventListener("click", async () => {
        if (!state.token) {
          setStatus("Select a commander first.", true);
          return;
        }
        try {
          if (state.orderMode === "attack") {
            if (!state.stagedAttack) {
              setStatus("Stage an adjacent enemy target to issue an attack order.", true);
              return;
            }
            await api(
              "/v1/me/actions",
              {
                method: "POST",
                body: JSON.stringify({
                  kind: "attack",
                  target_h3: state.stagedAttack.target_h3,
                  target_army_id: state.stagedAttack.target_army_id,
                }),
              },
              true
            );
          } else if (state.orderMode === "besiege") {
            if (!state.stagedSiege) {
              setStatus("Stage an adjacent stronghold to issue a siege order.", true);
              return;
            }
            await api(
              "/v1/me/actions",
              {
                method: "POST",
                body: JSON.stringify({
                  kind: "besiege",
                  target_stronghold_id: state.stagedSiege.stronghold_id,
                }),
              },
              true
            );
          } else {
            const payload = state.orderMode === "forage"
              ? { kind: "forage", path: [] }
              : { kind: "march", path: state.stagedPath.slice() };
            await api(
              "/v1/me/actions/plan",
              {
                method: "POST",
                body: JSON.stringify(payload),
              },
              true
            );
            if (state.orderMode === "forage") {
              setStatus("Forage order issued.");
            } else {
              const leagues = state.stagedPath.length;
              setStatus(leagues ? `${leagues}-league march ordered.` : "Halt ordered.");
            }
          }
          state.stagedPath = [];
          state.stagedAttack = null;
          state.stagedSiege = null;
          state.validNextMoves = new Set();
          state.validAttackTargets = new Map();
          state.validBesiegeTargets = new Map();
          renderOrdersPanel();
          await refreshView();
          await refreshAlerts();
        } catch (err) {
          setStatus(`Order submit failed: ${err.message}`, true);
        }
      });
      els.composeToggleBtn.addEventListener("click", () => {
        const isHidden = els.composeBox.hasAttribute("hidden");
        if (isHidden) {
          els.composeBox.removeAttribute("hidden");
          els.composeToggleBtn.textContent = "Hide Composer";
        } else {
          els.composeBox.setAttribute("hidden", "");
          els.composeToggleBtn.textContent = "Send Letter";
        }
      });
      els.sendLetterBtn.addEventListener("click", async () => {
        if (!state.token) {
          setStatus("Select a commander first.", true);
          return;
        }
        const recipientId = els.recipientSelect.value;
        const content = els.letterInput.value.trim();
        if (!recipientId) {
          setStatus("Select a recipient.", true);
          return;
        }
        if (!content) {
          setStatus("Write a message before sending.", true);
          return;
        }
        try {
          await api(
            "/v1/me/messages",
            {
              method: "POST",
              body: JSON.stringify({ recipient_id: recipientId, content, priority: "normal" }),
            },
            true
          );
          els.letterInput.value = "";
          els.composeBox.setAttribute("hidden", "");
          els.composeToggleBtn.textContent = "Send Letter";
          await refreshAlerts();
          await refreshInbox();
        } catch (err) {
          setStatus(`Send failed: ${err.message}`, true);
        }
      });
      els.mapCanvas.addEventListener("mouseleave", () => {
        hideHoverCard();
      });
      els.hoverCard.addEventListener("click", (event) => event.stopPropagation());
      try {
        await loadCommanders();
        renderCorrespondents();
        renderInbox();
        const rect = els.mapPanel.getBoundingClientRect();
        state.mapWidth = Math.max(600, Math.floor(rect.width - 2));
        state.mapHeight = Math.max(420, Math.floor(rect.height - 2));
      } catch (err) {
        setStatus(`Init error: ${err.message}`, true);
      }
    })();
  </script>
</body>
</html>
