<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>For Want of a Nail Dev Dashboard</title>
  <style>
    :root {
      --bg: #f4efe7;
      --panel: #fffaf2;
      --ink: #1e1b18;
      --muted: #6f665a;
      --accent: #0f6d63;
      --accent-2: #8a3c1f;
      --line: #d9cdbd;
      --error: #a81f1f;
      --ok: #145f39;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 90% -10%, #dbece8 0%, transparent 40%),
        radial-gradient(circle at -10% 110%, #f5ddcf 0%, transparent 38%),
        var(--bg);
      min-height: 100vh;
      padding: 24px;
    }
    h1 {
      margin: 0 0 16px;
      font-size: 28px;
      letter-spacing: 0.02em;
    }
    .grid {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      align-items: start;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.05);
    }
    .stack {
      display: grid;
      gap: 16px;
    }
    .title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 10px;
    }
    .clock-readout {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }
    .clock-day {
      font-size: 34px;
      font-weight: 700;
      color: var(--accent-2);
    }
    .clock-watch {
      font-size: 20px;
      font-weight: 600;
    }
    label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }
    input, button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      background: #fff;
    }
    input { margin-bottom: 10px; }
    button {
      cursor: pointer;
      border-color: transparent;
      color: #fff;
      background: linear-gradient(135deg, var(--accent), #138d7f);
      font-weight: 600;
      margin-bottom: 8px;
    }
    button.secondary {
      background: linear-gradient(135deg, #394a5f, #54718f);
    }
    button.danger {
      background: linear-gradient(135deg, #8a2c24, #b14032);
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .inline {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .toggle-row {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px;
      align-items: center;
      margin: 6px 0 10px;
      color: var(--ink);
      font-size: 14px;
    }
    .toggle-row input {
      width: auto;
      margin: 0;
    }
    .status {
      margin-top: 8px;
      min-height: 18px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.35;
    }
    .status.error { color: var(--error); }
    .status.ok { color: var(--ok); }
    .summary-list {
      display: grid;
      gap: 8px;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .summary-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      font-size: 14px;
      line-height: 1.35;
      overflow: hidden;
    }
    .summary-item-message {
      padding: 10px 12px;
    }
    .summary-button {
      width: 100%;
      margin: 0;
      border: 0;
      border-radius: 0;
      padding: 10px 12px;
      color: var(--ink);
      background: transparent;
      text-align: left;
      font-weight: 400;
    }
    .summary-button:hover,
    .summary-button:focus-visible {
      background: #f2e8da;
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    .summary-item strong {
      font-weight: 800;
    }
    .summary-item.unclaimed {
      background: #eee9df;
      color: var(--muted);
      opacity: 0.62;
    }
    .summary-item.unclaimed strong {
      color: var(--muted);
    }
    .summary-item.unclaimed .summary-button {
      color: var(--muted);
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(30, 27, 24, 0.56);
    }
    .modal-overlay[hidden] {
      display: none;
    }
    .modal-dialog {
      width: min(680px, 100%);
      max-height: min(80vh, 720px);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 20px;
      background: var(--panel);
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.28);
    }
    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }
    .modal-title {
      margin: 0;
      font-size: 20px;
      line-height: 1.25;
    }
    .modal-close {
      width: auto;
      flex: 0 0 auto;
      margin: 0;
      padding: 7px 10px;
      background: #685f54;
    }
    .brief-text {
      margin: 0;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      font-size: 17px;
      line-height: 1.65;
      white-space: pre-wrap;
    }
    body.modal-open {
      overflow: hidden;
    }
    .muted {
      color: var(--muted);
    }
    @media (max-width: 900px) {
      body { padding: 16px; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <h1>For Want of a Nail - Dev Dashboard</h1>

  <div class="grid">
    <div class="stack">
      <section class="panel">
        <div class="title">Clock</div>
        <div class="clock-readout">
          <div class="clock-day" id="clockDay">Day -</div>
          <div class="clock-watch" id="clockWatch">Watch -</div>
        </div>
        <div class="status" id="clockStatus"></div>
      </section>

      <section class="panel">
        <div class="title">Admin</div>
        <label for="adminToken">Admin Token</label>
        <input id="adminToken" type="password" placeholder="matches DEV_ADMIN_TOKEN" autocomplete="off" />
        <button id="resetClaimsButton" class="danger" type="button">Reset Commander Claims</button>
        <button id="refreshButton" class="secondary" type="button">Refresh Dashboard</button>
        <div class="status" id="adminStatus"></div>
      </section>

      <section class="panel">
        <div class="title">Time Advancement</div>
        <label for="stepCount">Manual Advance Watches</label>
        <input id="stepCount" type="number" min="1" value="1" />
        <button id="advanceButton" type="button">Advance Time</button>

        <div class="toggle-row">
          <input id="autoAdvanceEnabled" type="checkbox" />
          <label for="autoAdvanceEnabled">Automatic advancement</label>
        </div>
        <label for="autoIntervalSeconds">Wall-Clock Interval Seconds</label>
        <input id="autoIntervalSeconds" type="number" min="5" step="5" value="60" />
        <div class="status" id="advanceStatus"></div>
      </section>
    </div>

    <section class="panel">
      <div class="title">Commander / Army Status</div>
      <ul class="summary-list" id="summaryList">
        <li class="summary-item summary-item-message muted">Loading army summary...</li>
      </ul>
      <div class="status" id="summaryStatus"></div>
    </section>
  </div>

  <div class="modal-overlay" id="briefModalOverlay" hidden>
    <section class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="briefModalTitle">
      <div class="modal-header">
        <h2 class="modal-title" id="briefModalTitle">Army Environs Brief</h2>
        <button class="modal-close" id="briefModalClose" type="button" aria-label="Close environs brief">Close</button>
      </div>
      <div class="status" id="briefModalStatus" aria-live="polite"></div>
      <p class="brief-text" id="briefModalText"></p>
    </section>
  </div>

  <script>
    const state = {
      autoTimer: null,
      autoBusy: false,
      lastAdvanceAt: null,
      briefRequestId: 0,
      briefTrigger: null,
    };

    const els = {
      clockDay: document.getElementById("clockDay"),
      clockWatch: document.getElementById("clockWatch"),
      clockStatus: document.getElementById("clockStatus"),
      adminToken: document.getElementById("adminToken"),
      resetClaimsButton: document.getElementById("resetClaimsButton"),
      refreshButton: document.getElementById("refreshButton"),
      adminStatus: document.getElementById("adminStatus"),
      stepCount: document.getElementById("stepCount"),
      advanceButton: document.getElementById("advanceButton"),
      autoAdvanceEnabled: document.getElementById("autoAdvanceEnabled"),
      autoIntervalSeconds: document.getElementById("autoIntervalSeconds"),
      advanceStatus: document.getElementById("advanceStatus"),
      summaryList: document.getElementById("summaryList"),
      summaryStatus: document.getElementById("summaryStatus"),
      briefModalOverlay: document.getElementById("briefModalOverlay"),
      briefModalTitle: document.getElementById("briefModalTitle"),
      briefModalClose: document.getElementById("briefModalClose"),
      briefModalStatus: document.getElementById("briefModalStatus"),
      briefModalText: document.getElementById("briefModalText"),
    };

    function adminHeaders() {
      const token = els.adminToken.value.trim();
      return token ? { "X-Admin-Token": token } : {};
    }

    function setStatus(el, message, kind = "") {
      el.textContent = message || "";
      el.classList.toggle("error", kind === "error");
      el.classList.toggle("ok", kind === "ok");
    }

    function readableErrorMessage(err) {
      const raw = String(err?.message || err || "").trim();
      if (!raw) {
        return "Unknown error";
      }
      try {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object" && typeof parsed.detail === "string" && parsed.detail.trim()) {
          return parsed.detail.trim();
        }
      } catch (_) {}
      return raw;
    }

    async function api(path, options = {}) {
      const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
      const method = String(options.method || "GET").toUpperCase();
      if (!["GET", "HEAD", "OPTIONS"].includes(method) && !headers["Idempotency-Key"]) {
        headers["Idempotency-Key"] = window.crypto.randomUUID();
      }
      const response = await fetch(path, { ...options, headers });
      const contentType = response.headers.get("content-type") || "";
      const data = contentType.includes("application/json") ? await response.json() : await response.text();
      if (!response.ok) {
        const msg = typeof data === "object" ? JSON.stringify(data) : data;
        throw new Error(msg || `${response.status} ${response.statusText}`);
      }
      return data;
    }

    async function refreshClock() {
      const time = await api("/v1/time");
      els.clockDay.textContent = `Day ${time.day}`;
      els.clockWatch.textContent = `Watch ${time.watch} (${time.watch_label})`;
      setStatus(els.clockStatus, `Synced ${new Date().toLocaleTimeString()}`);
    }

    function renderSummary(rows) {
      els.summaryList.replaceChildren();
      if (!rows.length) {
        const emptyItem = document.createElement("li");
        emptyItem.className = "summary-item summary-item-message muted";
        emptyItem.textContent = "No commander-led armies found.";
        els.summaryList.append(emptyItem);
        return;
      }
      for (const row of rows) {
        const army = String(row.army_name || "Unnamed army");
        const commander = String(row.commander_name || "No commander");
        const faction = String(row.faction || "No faction");
        const strength = Number(row.strength || 0).toLocaleString();
        const status = String(row.status || "unknown");
        const claimed = !!row.claimed;
        const item = document.createElement("li");
        item.className = `summary-item${claimed ? "" : " unclaimed"}`;
        const button = document.createElement("button");
        button.className = "summary-button";
        button.type = "button";
        button.setAttribute("aria-label", `Open environs brief for ${commander}, commanding ${army}`);
        const armyName = document.createElement("strong");
        armyName.textContent = army;
        button.append(armyName, document.createTextNode(` (${commander}, ${faction}): ${strength} strong, ${status}`));
        if (!claimed) {
          const claimStatus = document.createElement("span");
          claimStatus.className = "muted";
          claimStatus.textContent = " (unclaimed)";
          button.append(claimStatus);
        }
        button.addEventListener("click", () => openBriefModal(row, button));
        item.append(button);
        els.summaryList.append(item);
      }
    }

    async function refreshSummary() {
      const rows = await api("/v1/admin/armies/summary", { headers: adminHeaders() });
      renderSummary(rows);
      setStatus(els.summaryStatus, `Updated ${new Date().toLocaleTimeString()}`);
    }

    async function openBriefModal(row, trigger) {
      const commanderId = String(row.commander_id || "").trim();
      if (!commanderId) {
        setStatus(els.summaryStatus, "Brief error: commander ID is unavailable.", "error");
        return;
      }
      const requestId = state.briefRequestId + 1;
      state.briefRequestId = requestId;
      state.briefTrigger = trigger;
      const commander = String(row.commander_name || "Unknown commander");
      const army = String(row.army_name || "Unnamed army");
      els.briefModalTitle.textContent = `${commander} — ${army}`;
      els.briefModalText.textContent = "";
      setStatus(els.briefModalStatus, "Loading environs brief...");
      els.briefModalOverlay.hidden = false;
      document.body.classList.add("modal-open");
      els.briefModalClose.focus();
      try {
        const brief = await api(
          `/v1/admin/commanders/${encodeURIComponent(commanderId)}/brief`,
          { headers: adminHeaders() }
        );
        if (state.briefRequestId !== requestId) {
          return;
        }
        setStatus(els.briefModalStatus, "");
        els.briefModalText.textContent = String(brief || "No environs description is available.");
      } catch (err) {
        if (state.briefRequestId !== requestId) {
          return;
        }
        els.briefModalText.textContent = "";
        setStatus(els.briefModalStatus, `Brief error: ${readableErrorMessage(err)}`, "error");
      }
    }

    function closeBriefModal() {
      if (els.briefModalOverlay.hidden) {
        return;
      }
      state.briefRequestId += 1;
      els.briefModalOverlay.hidden = true;
      document.body.classList.remove("modal-open");
      const trigger = state.briefTrigger;
      state.briefTrigger = null;
      if (trigger && document.body.contains(trigger)) {
        trigger.focus();
      }
    }

    async function refreshDashboard() {
      try {
        await refreshClock();
        await refreshSummary();
      } catch (err) {
        setStatus(els.summaryStatus, `Refresh error: ${readableErrorMessage(err)}`, "error");
      }
    }

    async function advanceTime(steps, { automatic = false } = {}) {
      if (!Number.isFinite(steps) || steps < 1) {
        setStatus(els.advanceStatus, "Steps must be >= 1", "error");
        return;
      }
      if (state.autoBusy) {
        return;
      }
      state.autoBusy = true;
      els.advanceButton.disabled = true;
      try {
        const result = await api("/v1/admin/time/advance", {
          method: "POST",
          headers: adminHeaders(),
          body: JSON.stringify({ steps, execute_actions: true }),
        });
        state.lastAdvanceAt = new Date();
        const prefix = automatic ? "Auto-advanced" : "Advanced";
        setStatus(
          els.advanceStatus,
          `${prefix} to day ${result.end_time.day}, watch ${result.end_time.watch} (${result.end_time.watch_label}). ` +
            `Actions: ${result.actions_summary.started} started, ${result.actions_summary.completed} completed, ${result.actions_summary.failed} failed.`,
          "ok"
        );
        await refreshDashboard();
      } catch (err) {
        setStatus(els.advanceStatus, `Advance error: ${readableErrorMessage(err)}`, "error");
        if (automatic) {
          stopAutoAdvance();
        }
      } finally {
        state.autoBusy = false;
        els.advanceButton.disabled = false;
      }
    }

    function stopAutoAdvance() {
      if (state.autoTimer !== null) {
        window.clearInterval(state.autoTimer);
      }
      state.autoTimer = null;
      els.autoAdvanceEnabled.checked = false;
    }

    function startAutoAdvance() {
      const intervalSeconds = Number(els.autoIntervalSeconds.value || "60");
      if (!Number.isFinite(intervalSeconds) || intervalSeconds < 5) {
        setStatus(els.advanceStatus, "Automatic interval must be at least 5 seconds.", "error");
        els.autoAdvanceEnabled.checked = false;
        return;
      }
      if (state.autoTimer !== null) {
        window.clearInterval(state.autoTimer);
      }
      setStatus(els.advanceStatus, `Automatic advancement enabled: one watch every ${intervalSeconds} seconds.`, "ok");
      state.autoTimer = window.setInterval(() => {
        advanceTime(1, { automatic: true });
      }, intervalSeconds * 1000);
    }

    els.advanceButton.addEventListener("click", () => {
      advanceTime(Number(els.stepCount.value || "1"));
    });

    els.resetClaimsButton.addEventListener("click", async () => {
      const confirmed = window.confirm("Reset all commander claims and invalidate those player tokens?");
      if (!confirmed) {
        return;
      }
      try {
        els.resetClaimsButton.disabled = true;
        const result = await api("/v1/admin/claims/reset", {
          method: "POST",
          headers: adminHeaders(),
        });
        setStatus(els.adminStatus, `Reset ${result.reset_claims} commander claims.`, "ok");
        await refreshDashboard();
      } catch (err) {
        setStatus(els.adminStatus, `Claim reset error: ${readableErrorMessage(err)}`, "error");
      } finally {
        els.resetClaimsButton.disabled = false;
      }
    });

    els.refreshButton.addEventListener("click", refreshDashboard);
    els.briefModalClose.addEventListener("click", closeBriefModal);
    els.briefModalOverlay.addEventListener("click", (event) => {
      if (event.target === els.briefModalOverlay) {
        closeBriefModal();
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && !els.briefModalOverlay.hidden) {
        closeBriefModal();
      }
    });

    els.autoAdvanceEnabled.addEventListener("change", () => {
      if (els.autoAdvanceEnabled.checked) {
        startAutoAdvance();
      } else {
        stopAutoAdvance();
        setStatus(els.advanceStatus, "Automatic advancement disabled.");
      }
    });

    els.autoIntervalSeconds.addEventListener("change", () => {
      if (els.autoAdvanceEnabled.checked) {
        startAutoAdvance();
      }
    });

    (async function init() {
      await refreshDashboard();
    })();
  </script>
</body>
</html>
